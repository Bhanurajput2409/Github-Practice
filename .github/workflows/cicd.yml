name: CICD 

on: 
  workflow_dispatch:
    
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        run: echo " clone the code"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: build the code
        run: echo "build the code"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: test the code
        run: echo " test the code"
      
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: deploy the code
        run: echo " deploy the code"
        
